[project]
name = "generador-asignaciones-v2"
version = "2.0.0.dev0"
description = "Aplicación local para preparar el programa mensual de asignaciones."
requires-python = ">=3.12,<3.13"
dependencies = [
    "nicegui==4.1.0",
    "pywebview==6.2.1",
    "SQLAlchemy==2.1.9",
    "alembic==1.20.1",
    "ortools==9.15.6755",
    "openpyxl==3.1.5",
    "pypdfium2==5.15.2",
    "Pillow>=12,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
